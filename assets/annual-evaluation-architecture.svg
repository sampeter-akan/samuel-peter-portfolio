<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc"><title id="title">Annual Evaluation Performance App — system architecture</title><desc id="desc">Vercel hosts static React assets. Browser state and localStorage manage employee records. Fifteen criteria and weights feed N/A normalization and composite calculation; only the composite feeds automated policy thresholds. Target counts are separate. Outputs include scorecard, radar, comparison and report.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9bb9d4"/></marker><style>text{font-family:Arial,sans-serif;fill:#f5f7fa}.h{font-size:23px;font-weight:700}.b{font-size:20px;fill:#c9d9ea}.small{font-size:17px;fill:#b4c7db}.box{fill:#15283a;stroke:#45627d;stroke-width:2}.line{fill:none;stroke:#9bb9d4;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1500" height="1000" rx="20" fill="#0b1523"/><text x="42" y="61" font-size="37" font-weight="700">Annual Evaluation Performance App</text><text x="44" y="97" font-size="23" fill="#9ed6ef">SYSTEM ARCHITECTURE  ·  CLIENT-SIDE POLICY SIMULATOR</text><rect x="42" y="122" width="1416" height="74" rx="15" fill="#1b3348" stroke="#4e7c9d"/><text x="69" y="153" class="h">Vercel static hosting</text><text x="69" y="180" class="b">Vite 6 builds browser assets · React 18 · Tailwind CSS 3 · No application backend</text><path class="line" d="M750 196V224"/><rect x="42" y="225" width="1416" height="729" rx="18" fill="#0e1c2b" stroke="#52708b" stroke-width="2"/><text x="66" y="261" class="h" fill="#84d6f9">BROWSER  /  REACT APPLICATION</text>
<rect class="box" x="70" y="283" width="430" height="103" rx="12"/><text class="h" x="89" y="313">Appraisal workspace</text><text class="b" x="89" y="340">Staff profiles · Parts I–IV</text><text class="b" x="89" y="365">Tasks, targets, remarks and review</text><rect class="box" x="535" y="283" width="430" height="103" rx="12"/><text class="h" x="554" y="313">React state + derived metrics</text><text class="b" x="554" y="340">useState · useMemo · useEffect</text><text class="b" x="554" y="365">Seeded profiles or user-created records</text><rect class="box" x="1000" y="283" width="430" height="103" rx="12"/><text class="h" x="1019" y="313">Browser localStorage</text><text class="b" x="1019" y="340">Employee records persist locally</text><text class="b" x="1019" y="365">No shared database or authentication</text><rect class="box" x="70" y="437" width="430" height="128" rx="12"/><text class="h" x="89" y="467">15 rubric criteria (1–5)</text><text class="b" x="89" y="494">Section A: 3 · Section B: 12</text><text class="b" x="89" y="519">Four role-dependent N/A toggles</text><text class="small" x="89" y="544">Configurable section weights</text><rect class="box" x="535" y="437" width="430" height="128" rx="12"/><text class="h" x="554" y="467">Deterministic scoring engine</text><text class="b" x="554" y="494">Exclude N/A from section averages</text><text class="b" x="554" y="519">Composite = avg A × wA + avg B × wB</text><text class="small" x="554" y="544">wA + wB = 1</text><rect class="box" x="1000" y="437" width="430" height="128" rx="12"/><text class="h" x="1019" y="467">Part III target statistics</text><text class="b" x="1019" y="494">Count exceeded / met / not met</text><text class="b" x="1019" y="519">Descriptive results only</text><text class="small" x="1019" y="544">Not an input to policy thresholds</text><rect class="box" x="535" y="620" width="430" height="116" rx="12"/><text class="h" x="554" y="650">Policy rule engine</text><text class="b" x="554" y="677">Composite-only thresholds</text><text class="b" x="554" y="702">Increment / promotability suggestions</text><text class="small" x="554" y="727">Manual officer override</text><rect class="box" x="70" y="620" width="430" height="116" rx="12"/><text class="h" x="89" y="650">10-axis SVG competency radar</text><text class="b" x="89" y="677">Selected scores and peer overlay</text><text class="b" x="89" y="702">Written + oral communication combined</text><rect class="box" x="1000" y="620" width="430" height="116" rx="12"/><text class="h" x="1019" y="650">Executive scorecard</text><text class="b" x="1019" y="677">Composite, percentage and tier</text><text class="b" x="1019" y="702">Section averages and target counts</text><rect class="box" x="70" y="790" width="1360" height="100" rx="12"/><text class="h" x="89" y="820">Appraisal outputs</text><text class="b" x="89" y="847">Side-by-side staff comparison · Official printable form · Training and development review</text><text class="b" x="89" y="872">Recommendations support human judgment; they do not constitute approved HR decisions.</text>
<path class="line" d="M500 334H535"/><path class="line" d="M965 323H1000"/><path class="line" d="M1000 346H965"/><path class="line" d="M750 386V437"/><path class="line" d="M500 500H535"/><path class="line" d="M750 565V620"/><path class="line" d="M285 565V620"/><path class="line" d="M1215 565V620"/><path class="line" d="M965 677H1000"/><path class="line" d="M285 736V790"/><path class="line" d="M750 736V790"/><path class="line" d="M1215 736V790"/><text x="66" y="931" class="small">Scope: local demonstration · No server-side appraisal processing, access controls or central audit trail.</text></svg>