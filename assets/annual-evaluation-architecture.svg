<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">Annual Evaluation Performance App — System Architecture</title>
<desc id="desc">A decoupled, client-side reactive architecture for policy simulation, deterministic scoring and browser-persistent state management. The three layers are State and Persistence, Presentation and Executive Workspace, and Deterministic Evaluation and Decision. The scoring simulator has 15 criterion sliders, three in Section A and twelve in Section B, plus a policy weighting slider.</desc>
